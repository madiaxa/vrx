name: Release
on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            executable: vrx
          - os: macos-15
            target: aarch64-apple-darwin
            executable: vrx
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: vrx.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Linux development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libvulkan-dev libfontconfig1-dev fonts-dejavu-core
      - run: cargo fmt --check
      - run: cargo test --locked --all-features
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Archive binary, documentation, notices and checksums
        run: python packaging/package_release.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --target ${{ matrix.target }} --output dist
      - uses: actions/upload-artifact@v7
        with:
          name: vrx-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  freebsd:
    uses: ./.github/workflows/freebsd.yml
    with:
      package: true
  draft:
    needs: [native, freebsd]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: vrx-*
          merge-multiple: true
          path: release-assets
      - name: Include the tagged source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git archive --format=tar.gz --prefix=vrx/ --output="release-assets/vrx-${RELEASE_TAG}-source.tar.gz" HEAD
          cd release-assets
          sha256sum "vrx-${RELEASE_TAG}-source.tar.gz" > "vrx-${RELEASE_TAG}-source.tar.gz.sha256"
      - name: Create a draft prerelease after every platform succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "VRX $RELEASE_TAG" --notes-file packaging/RELEASE_NOTES.md --draft --prerelease
